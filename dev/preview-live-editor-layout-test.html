<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Board Mode LiveEditor Layout Test</title>
  <style>
    html, body {
      min-width: 1000px;
      min-height: 760px;
      margin: 0;
      font-family: sans-serif;
      background: #f4f5f7;
    }

    /* Fake LiveEditor toolbar. It deliberately uses the same LiaScript shell
       selectors as the preview so leaking controls are easy to detect. */
    body > #lia-toolbar-nav {
      box-sizing: border-box;
      height: 58px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #adb3bc;
      background: #fff;
    }

    body > #lia-toolbar-nav > .lia-header__left {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 100%;
      padding: 0 14px;
    }

    .editor-button {
      height: 36px;
      padding: 0 12px;
      border: 1px solid #737b86;
      border-radius: 6px;
      background: #fff;
    }

    #liascript-preview {
      display: block;
      width: 920px;
      height: 620px;
      margin: 18px;
      border: 3px solid #535b66;
      background: #fff;
    }

    #live-editor-layout-result {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 20;
      max-width: min(760px, calc(100vw - 16px));
      max-height: 45vh;
      overflow: auto;
      margin: 0;
      padding: 8px;
      border: 1px solid #777;
      background: #fff;
      font: 12px/1.35 monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header id="lia-toolbar-nav" aria-label="Fake LiveEditor toolbar">
    <div class="lia-header__left">
      <button id="lia-btn-toc" class="lia-btn editor-button" type="button">
        Editor TOC
      </button>
      <button class="editor-button" type="button">Editor</button>
    </div>
  </header>

  <iframe id="liascript-preview" title="LiaScript Preview-Shell"></iframe>
  <pre id="live-editor-layout-result">running</pre>

  <script>
    // Make a leaked ROOT_WIN tick deterministic in headless browsers, too.
    window.requestAnimationFrame = function (callback) {
      return window.setTimeout(function () {
        callback(performance.now());
      }, 0);
    };
    window.cancelAnimationFrame = window.clearTimeout;

    (async function runLiveEditorLayoutTest() {
      const wait = ms => new Promise(resolve => window.setTimeout(resolve, ms));
      const result = document.getElementById('live-editor-layout-result');
      const previewFrame = document.getElementById('liascript-preview');
      const closeScript = '</scr' + 'ipt>';

      function waitForLoad(frame) {
        return new Promise(resolve => {
          frame.addEventListener('load', resolve, { once: true });
        });
      }

      function count(doc, selector) {
        return doc.querySelectorAll(selector).length;
      }

      function rectDetails(rect) {
        if (!rect) return null;
        return {
          left: Math.round(rect.left * 100) / 100,
          top: Math.round(rect.top * 100) / 100,
          right: Math.round(rect.right * 100) / 100,
          bottom: Math.round(rect.bottom * 100) / 100,
          width: Math.round(rect.width * 100) / 100,
          height: Math.round(rect.height * 100) / 100
        };
      }

      try {
        try {
          localStorage.setItem('settings', JSON.stringify({
            mode: 'presentation',
            language: 'de'
          }));
        } catch (e) { }

        const shellLoaded = waitForLoad(previewFrame);
        previewFrame.srcdoc = `<!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8" />
            <style>
              :root { --color-highlight: 11, 95, 255; }
              html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
              body { font-family: sans-serif; background: #2e2e2e; }
              .lia-canvas { width: 100%; height: 100%; }
              #lia-toolbar-nav {
                box-sizing: border-box;
                width: 100%;
                height: 56px;
                display: flex;
                align-items: center;
                border-bottom: 1px solid #555;
                background: #303030;
              }
              .lia-header__left {
                box-sizing: border-box;
                display: flex;
                align-items: center;
                gap: 8px;
                width: 100%;
                height: 56px;
                padding: 0 12px;
              }
              #lia-btn-toc {
                box-sizing: border-box;
                width: 40px;
                height: 40px;
                border: 0;
                border-radius: 5px;
                background: rgb(11, 95, 255);
                color: #fff;
              }
              #course-frame {
                display: block;
                width: 100%;
                height: calc(100% - 56px);
                border: 0;
                background: #fff;
              }
            </style>
          </head>
          <body>
            <div class="lia-canvas lia-mode--presentation">
              <header id="lia-toolbar-nav">
                <div class="lia-header__left">
                  <button id="lia-btn-toc" class="lia-btn" type="button"
                    aria-label="Inhaltsverzeichnis">TOC</button>
                  <span id="preview-toolbar-marker">Preview</span>
                </div>
              </header>
              <iframe id="course-frame" title="Simulierter LiaScript-Kurs"></iframe>
            </div>
          </body>
          </html>`;
        await shellLoaded;

        const previewWindow = previewFrame.contentWindow;
        const previewDocument = previewFrame.contentDocument;
        previewWindow.requestAnimationFrame = function (callback) {
          return previewWindow.setTimeout(function () {
            callback(previewWindow.performance.now());
          }, 0);
        };
        previewWindow.cancelAnimationFrame = previewWindow.clearTimeout;

        try {
          previewWindow.localStorage.setItem('settings', JSON.stringify({
            mode: 'presentation',
            language: 'de'
          }));
        } catch (e) { }

        const courseFrame = previewDocument.getElementById('course-frame');
        const courseLoaded = waitForLoad(courseFrame);
        const distUrl = new URL('../dist/index.js', document.baseURI).href;

        courseFrame.srcdoc =
          '<!doctype html>' +
          '<html lang="de"><head><meta charset="utf-8" /></head><body>' +
          '<div class="lia-slide__container">' +
          '<main class="lia-slide__content"><h1>Testkurs</h1></main>' +
          '</div>' +
          '<script>' +
          'try{localStorage.setItem("settings",JSON.stringify({' +
          'mode:"presentation",language:"de"}));}catch(e){}' +
          'window.requestAnimationFrame=function(callback){' +
          'return window.setTimeout(function(){callback(performance.now());},0);};' +
          'window.cancelAnimationFrame=window.clearTimeout;' +
          closeScript +
          '<script src="' + distUrl + '?t=live-editor-layout">' +
          closeScript +
          '</body></html>';
        await courseLoaded;
        await wait(700);

        const courseDocument = courseFrame.contentDocument;
        const button = previewDocument.getElementById('lia-tff-btn-v2');
        const overlay = previewDocument.getElementById('lia-tff-overlay-v2');
        const panel = previewDocument.getElementById('lia-tff-panel-v2');
        const rootStyle = previewDocument.getElementById('lia-tff-style-root-v2');
        const slot = previewDocument.getElementById('lia-tff-inline-slot-v2');
        const toc = previewDocument.getElementById('lia-btn-toc');
        const toolbar = previewDocument.getElementById('lia-toolbar-nav');
        const toolbarLeft = toolbar && toolbar.querySelector('.lia-header__left');

        if (button) button.click();
        await wait(80);

        const tracked = [
          '#lia-tff-btn-v2',
          '#lia-tff-overlay-v2',
          '#lia-tff-panel-v2',
          '#lia-tff-style-root-v2'
        ];
        const outerCounts = Object.fromEntries(
          tracked.map(selector => [selector, count(document, selector)])
        );
        const previewCounts = Object.fromEntries(
          tracked.map(selector => [selector, count(previewDocument, selector)])
        );
        const courseCounts = Object.fromEntries(
          tracked.map(selector => [selector, count(courseDocument, selector)])
        );

        const controlsOnlyInPreview = tracked.every(selector =>
          outerCounts[selector] === 0 &&
          previewCounts[selector] === 1 &&
          courseCounts[selector] === 0
        );
        const correctOwners = Boolean(
          button && overlay && panel && rootStyle &&
          button.ownerDocument === previewDocument &&
          overlay.ownerDocument === previewDocument &&
          panel.ownerDocument === previewDocument &&
          rootStyle.ownerDocument === previewDocument
        );
        const inlineAfterPreviewToc = Boolean(
          slot && toc && toolbarLeft && button &&
          slot.parentElement === toolbarLeft &&
          toc.nextElementSibling === slot &&
          slot.previousElementSibling === toc &&
          button.parentElement === slot
        );

        const buttonRect = button && button.getBoundingClientRect();
        const toolbarRect = toolbar && toolbar.getBoundingClientRect();
        const buttonInsideToolbar = Boolean(
          buttonRect && toolbarRect &&
          buttonRect.width > 6 && buttonRect.height > 6 &&
          buttonRect.left >= toolbarRect.left - 1 &&
          buttonRect.top >= toolbarRect.top - 1 &&
          buttonRect.right <= toolbarRect.right + 1 &&
          buttonRect.bottom <= toolbarRect.bottom + 1
        );

        const panelRect = panel && panel.getBoundingClientRect();
        const panelOpenedInPreview = Boolean(
          panel &&
          previewDocument.body.classList.contains('lia-tff-panel-open') &&
          !document.body.classList.contains('lia-tff-panel-open') &&
          !courseDocument.body.classList.contains('lia-tff-panel-open') &&
          previewWindow.getComputedStyle(panel).display !== 'none' &&
          panelRect && panelRect.width > 6 && panelRect.height > 6
        );

        const metrics = {
          controlsOnlyInPreview,
          correctOwners,
          inlineAfterPreviewToc,
          buttonInsideToolbar,
          panelOpenedInPreview,
          outerCounts,
          previewCounts,
          courseCounts,
          buttonRect: rectDetails(buttonRect),
          toolbarRect: rectDetails(toolbarRect),
          panelRect: rectDetails(panelRect)
        };
        const pass = Object.entries(metrics)
          .filter(([, value]) => typeof value === 'boolean')
          .every(([, value]) => value);

        document.body.dataset.liveEditorLayoutTest = pass ? 'pass' : 'fail';
        result.textContent = JSON.stringify({ pass, ...metrics });
      } catch (error) {
        document.body.dataset.liveEditorLayoutTest = 'fail';
        result.textContent = JSON.stringify({
          pass: false,
          error: error && error.stack ? error.stack : String(error)
        });
      }
    })();
  </script>
</body>
</html>
